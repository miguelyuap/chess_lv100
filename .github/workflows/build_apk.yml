name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev \
            cython3 zlib1g-dev openjdk-17-jdk unzip zip autoconf libtool pkg-config

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build Android APK with Buildozer
        run: |
          yes | buildozer -s android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Lv100-Android-APK
          path: bin/*.apk
